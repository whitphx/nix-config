# Shared tmux overrides for SSH-side sessions. Imported *inside* the
# `if-shell '[ -n "$SSH_CONNECTION" ] || [ -n "$SSH_TTY" ]' { ... }`
# block by both:
#   - home/common (nix tmux; mac + paperspace), and
#   - home/linux/nix-user-chroot (the host's /usr/bin/tmux).
# Lives at home/ (not inside either module) because the Darwin build
# imports home/common but never home/linux, so the source of truth has
# to sit somewhere both can `builtins.readFile`.
#
# Swapping the prefix off C-o and restyling the status/borders marks
# "this is the SSH-side session" so it doesn't collide with — or look
# identical to — an outer tmux on the machine you SSH'd from.
#
# NOT shared: `status-right`. Each importer appends its own afterward,
# because common's uses the battery/online/prefix-highlight plugins,
# which load from /nix/store and therefore can't run in a host tmux
# server (it lives outside the chroot with no /nix mounted).
set -g prefix C-u
bind-key C-u send-prefix
# Neutralise C-o so the default `prefix + C-o = rotate-window` doesn't
# leak through after the prefix moves to C-u.
bind-key C-o run-shell "true"
set -g status-left " 🌐 #h  W-#I P-#P #[fg=green]#{=40:pane_title}"
set -g status-style fg=colour255,bg=colour52
set -g pane-border-style fg=colour167,bg=colour52
set -g pane-active-border-style fg=colour209,bg=colour88
